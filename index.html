<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAREINA | Sistema de Ventas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-page">

  <main class="login-layout">

    <section class="login-visual">
      <div class="visual-overlay">
        <div class="marca-grande">
          <div class="destellos">✦ ✧</div>
          <h1>ZAREINA</h1>
          <p>Moda que eleva tu esencia</p>
        </div>

        <div class="frase-principal">
          Más que moda,<br>
          es tu esencia
        </div>

        <div class="frase-secundaria">
          Viste momentos, crea historias
        </div>
      </div>
    </section>

    <section class="login-panel">

      <div class="login-card">

        <div class="login-marca">
          <span class="destello">✦</span>
          <h2>ZAREINA</h2>
          <p>Moda que eleva tu esencia</p>
        </div>

        <div class="bienvenida">
          <h3>Ingresa a tu cuenta</h3>
          <p>Accede al sistema de ventas</p>
        </div>

        <form id="formLogin">

          <div class="campo">
            <label for="usuario">Usuario</label>

            <div class="input-con-icono">
              <span>👤</span>
              <input
                id="usuario"
                type="text"
                autocomplete="username"
                placeholder="Ingresa tu usuario"
                required
              >
            </div>
          </div>

          <div class="campo">
            <label for="clave">Contraseña</label>

            <div class="input-con-icono">
              <span>🔒</span>

              <input
                id="clave"
                type="password"
                autocomplete="current-password"
                placeholder="Ingresa tu contraseña"
                required
              >

              <button
                type="button"
                id="btnMostrarClave"
                class="btn-ojo"
                aria-label="Mostrar contraseña"
              >
                👁
              </button>
            </div>
          </div>

          <div
            id="mensajeLogin"
            class="mensaje-login"
          ></div>

          <button
            type="submit"
            class="btn-ingresar"
          >
            Ingresar
            <span>→</span>
          </button>

        </form>

        <div class="detalle-login">
          Pequeños detalles hacen grandes historias ♥
        </div>

      </div>

      <footer class="login-footer">
        <span>@zareina.peru</span>
        <span>986 796 366</span>
      </footer>

    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
